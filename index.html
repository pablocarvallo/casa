<style>
/* Concepto: la portada de las apps de la casa. Arriba, lo que hay que atender hoy; luego las cuatro cuentas
   (FAN, Master, LiderBCI y Copec) y la lista de la casa (pagos, gas, cápsula, sábanas y mesadas).
   El panel no guarda datos propios: lee lo que cada app publica en el buzón privado de GitHub. */
/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────
   Paleta: #2950F4 · #4D78F3 · #719DF6 · #99C2F8 · #BDEBFB, con el azul marino #182D4A de fondo oscuro.
   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg: #0A1224;
    --ds-bg-top: #13244A;
    --ds-surface: #152340;
    --ds-surface-2: #1C2C4D;
    --ds-fill: rgba(113, 157, 246, 0.12);
    --ds-fill-2: rgba(113, 157, 246, 0.2);
    --ds-ink: #EEF3FF;
    --ds-ink-2: #A9B6D0;
    --ds-ink-3: #77859F;
    --ds-line: rgba(189, 235, 251, 0.11);
    --ds-line-2: rgba(189, 235, 251, 0.2);
    --ds-tint: #8EB0FA;
    --ds-tint-soft: rgba(113, 157, 246, 0.18);
    --ds-btn: #3A62F5;
    --ds-on-btn: #FFFFFF;
    --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
    --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
    --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
    --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
    --ds-glass: rgba(24, 40, 70, 0.62);
    --ds-glass-strong: rgba(24, 40, 70, 0.84);
    --ds-glass-line: rgba(255, 255, 255, 0.14);
    --ds-glass-edge: rgba(0, 0, 0, 0.4);
    --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
    --ds-scrim: rgba(0, 0, 0, 0.55);
    --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-bg: #0A1224;
  --ds-bg-top: #13244A;
  --ds-surface: #152340;
  --ds-surface-2: #1C2C4D;
  --ds-fill: rgba(113, 157, 246, 0.12);
  --ds-fill-2: rgba(113, 157, 246, 0.2);
  --ds-ink: #EEF3FF;
  --ds-ink-2: #A9B6D0;
  --ds-ink-3: #77859F;
  --ds-line: rgba(189, 235, 251, 0.11);
  --ds-line-2: rgba(189, 235, 251, 0.2);
  --ds-tint: #8EB0FA;
  --ds-tint-soft: rgba(113, 157, 246, 0.18);
  --ds-btn: #3A62F5;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
  --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
  --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
  --ds-glass: rgba(24, 40, 70, 0.62);
  --ds-glass-strong: rgba(24, 40, 70, 0.84);
  --ds-glass-line: rgba(255, 255, 255, 0.14);
  --ds-glass-edge: rgba(0, 0, 0, 0.4);
  --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
  --ds-scrim: rgba(0, 0, 0, 0.55);
  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: dark;
}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/*DS:TOKENS:END*/
/*DS:VARS:START*/

/* Variables propias de Panel Casa */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --piti: #2950F4; --piti-bg: #E5ECFE; --emi: #0B85BD; --emi-bg: #DCF2FB;
  --ring: #C3CBDB;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --ring: #42537A; }
}
:root[data-theme="dark"] { --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --ring: #42537A; }
/*DS:VARS:END*/

/*DS:BASE:START*/
/* ── Domésticas · elementos comunes (v1): fondo, tipografía, campos, icono de la app ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/*DS:BASE:END*/
/*DS:COMP:START*/
/* ── Domésticas · componentes comunes (v1) ── */
body { font-size: 17px; line-height: 1.38; }
.app { gap: 20px; padding-block: 14px 48px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: -0.005em; color: var(--ds-ink-2); }
.muted { color: var(--ds-ink-2); }

/* Encabezado con título grande */
.top { gap: 12px; padding-top: 6px; }
.top h1 { font-size: 34px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.mark {
  width: 46px; height: 46px; border-radius: 13px; color: #fff; background: var(--ds-hero);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(14, 27, 51, 0.18), 0 4px 12px rgba(41, 80, 244, 0.28);
}
.mark svg, .mark img { filter: drop-shadow(0 1px 1px rgba(14, 27, 51, 0.25)); }

/* Botones: cápsulas, relleno sólido o tintado */
.btn {
  min-height: 50px; border-radius: var(--ds-r-pill); border: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  transition: transform 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
}
.btn:active { transform: scale(0.97); opacity: 0.88; }
.btn.primary { background: var(--ds-btn); color: var(--ds-on-btn); box-shadow: var(--ds-shadow-btn); }
.btn.tonal { background: var(--ds-tint-soft); color: var(--ds-tint); }
.btn.ghost { background: var(--ds-surface); color: var(--ds-tint); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.plus { background: var(--ds-surface); color: var(--ds-pos); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.danger { background: var(--ds-neg-soft); color: var(--ds-neg); border: 0; }
.btn.danger.armed { background: var(--ds-neg); color: #fff; }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn.big { min-height: 58px; border-radius: 20px; font-size: 16px; line-height: 1.2; }
.linkbtn { color: var(--ds-tint); text-decoration: none; font-size: 15px; }

/* Tarjeta principal: degradado de la paleta con brillo de vidrio */
.hero {
  border-radius: 28px; padding: 20px 20px 18px; background: var(--ds-hero); color: var(--ds-hero-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 0 rgba(14, 27, 51, 0.16), 0 16px 34px rgba(41, 80, 244, 0.26);
}
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 38%); }
.hero-mark, .hero-art { opacity: 0.12; }
.hero .eyebrow, .hero-note { color: var(--ds-hero-ink-2); }
.hero-btn, .hero .chip, .hero button.ghost {
  background: var(--ds-hero-glass); border: 0.5px solid rgba(255, 255, 255, 0.45); color: #fff;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.hero-cta { border-radius: var(--ds-r-pill); background: #fff; color: var(--ds-b1); font-weight: 700; padding: 0 20px; box-shadow: 0 6px 16px rgba(14, 27, 51, 0.2); }
.total { font-family: var(--ds-font-round); font-weight: 700; letter-spacing: -0.025em; }
.hero-stats { border-top-color: var(--ds-hero-line); }
.hero-stats dt { color: var(--ds-hero-ink-2); }

/* Encabezados de sección */
.sec-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; }
.sync { color: var(--ds-ink-2); }

/* Listas agrupadas (estilo Ajustes de iOS) */
.list, .steps {
  gap: 0; background: var(--ds-surface); border-radius: var(--ds-r-card); overflow: hidden; box-shadow: var(--ds-shadow-1);
}
.row, .step {
  position: relative; border: 0; border-radius: 0; background: transparent; min-height: 60px; padding: 11px 16px 11px 14px;
}
.row:active, .step:active { background: var(--ds-fill); }
.row.old { background: transparent; opacity: 0.62; }
.list > li + li > .row::before, .steps > li + li > .step::before {
  content: ""; position: absolute; top: 0; right: 0; left: 64px; border-top: 0.5px solid var(--ds-line-2);
}
.ico { width: 38px; height: 38px; background: var(--ds-fill); color: var(--ds-ink-2); }
.ico.in { background: var(--ds-pos-soft); color: var(--ds-pos); }
.ico.auto { background: var(--ds-tint-soft); color: var(--ds-tint); }
.store { font-weight: 600; }
.meta, .run { color: var(--ds-ink-2); }
.amt { font-weight: 600; }
.amt.in { color: var(--ds-pos); }
.tag { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step-n { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step.done .step-n { background: var(--ds-pos-soft); color: var(--ds-pos); }
.step-t span { color: var(--ds-ink-2); }
.anchor { color: var(--ds-ink-3); padding: 8px 16px; }
.anchor::before, .anchor::after { border-top: 0.5px solid var(--ds-line-2); }
.empty { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-ink-2); padding: 18px; }
.foot { color: var(--ds-ink-3); }

/* Filtros en cápsula */
.chip { border: 0; background: var(--ds-fill); color: var(--ds-ink); font-weight: 600; min-height: 36px; padding: 0 15px; }
.chip[aria-pressed="true"] { background: var(--ds-btn); color: #fff; }

/* Datos y respaldo */
.backup { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.backup textarea, .field textarea { border: 0; border-radius: var(--ds-r-field); background: var(--ds-surface-2); }

/* Hojas (sheets) */
.backdrop { background: var(--ds-scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.panel {
  background: var(--ds-surface); border-radius: var(--ds-r-sheet) var(--ds-r-sheet) 0 0; padding-top: 30px;
  box-shadow: 0 -10px 40px rgba(14, 27, 51, 0.18); animation: ds-rise 0.28s cubic-bezier(0.2, 0.9, 0.25, 1);
}
.panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--ds-line-2); }
.panel h2 { font-size: 24px; font-weight: 700; }
.panel .sub { color: var(--ds-ink-2); }
.field > span { font-size: 13px; font-weight: 600; color: var(--ds-ink-2); padding-left: 4px; }
.field input[type="date"], .field input[type="time"], .field input[type="text"], .field input[type="url"], .field input[type="number"], .field input:not([type]), .field select {
  border: 1.5px solid transparent; border-radius: var(--ds-r-field); background: var(--ds-surface-2); min-height: 50px;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--ds-tint); box-shadow: 0 0 0 4px var(--ds-tint-soft); }
.price-wrap b { color: var(--ds-ink-3); }

/* Control segmentado en cápsula */
.seg { background: var(--ds-fill); border-radius: var(--ds-r-pill); padding: 4px; gap: 4px; }
.seg button { border-radius: var(--ds-r-pill); min-height: 40px; color: var(--ds-ink-2); }
.seg button[aria-pressed="true"] { background: var(--ds-surface); color: var(--ds-ink); box-shadow: 0 2px 8px rgba(14, 27, 51, 0.12), 0 0 0 0.5px rgba(14, 27, 51, 0.04); }

/* Avisos y notas */
.err { border-radius: var(--ds-r-field); background: var(--ds-neg-soft); color: var(--ds-neg); }
.note { border-radius: var(--ds-r-field); background: var(--ds-tint-soft); color: var(--ds-ink); }
.found li, .mails li { border-radius: 14px; background: var(--ds-surface-2); }
.guide li::before { background: var(--ds-tint-soft); color: var(--ds-tint); }
.peek summary, .how summary { color: var(--ds-tint); }
.how summary { color: var(--ds-ink); }
.raw { background: var(--ds-surface-2); border-radius: 12px; }
.mono { background: var(--ds-fill); font-family: var(--ds-font-mono); }

/* Aviso flotante de vidrio */
.toast {
  border-radius: var(--ds-r-pill); background: rgba(14, 27, 51, 0.86); color: #fff; padding: 8px 20px;
  -webkit-backdrop-filter: var(--ds-glass-blur); backdrop-filter: var(--ds-glass-blur);
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25), 0 10px 30px rgba(14, 27, 51, 0.3);
}
/* Tarjetas secundarias (Master: por tarjeta, cuotas; plegables) */
.tile, .cq { border: 0; border-radius: 20px; background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.fold { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.stepper button, .step-val { border: 0; background: var(--ds-surface-2); border-radius: var(--ds-r-field); }
.period { border-top: 0.5px solid var(--ds-line-2); }
.linkrow { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); min-height: 64px; padding: 12px 14px 12px 12px; }
.linkrow:active { background: var(--ds-surface-2); }
.linkrow > svg { color: var(--ds-ink-3); }
.mark.sm { width: 40px; height: 40px; border-radius: 11px; }
.num { background: var(--ds-tint-soft); color: var(--ds-tint); }
.mark.app-icon { display: block; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
.panel .btn.ghost { background: var(--ds-fill); box-shadow: none; }
/*DS:COMP:END*/
/*DS:APP:START*/

/* ── Panel Casa ── */
*, *::before, *::after { box-sizing: border-box; }
html.lock { overflow: hidden; }
[hidden] { display: none !important; }
body { margin: 0; padding-inline: 16px; letter-spacing: -0.012em; -webkit-text-size-adjust: 100%; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
svg { display: block; flex: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.muted { margin: 0; font-size: 15px; }
:focus-visible { outline: 3px solid var(--ds-tint); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
/* Las cifras grandes de las filas (gas, mesadas) no llevan el fondo de los números de pasos */
.r-big.num { background: none; color: inherit; }

/* Encabezado: icono + fecha + título grande, y el botón para actualizar */
.top { display: flex; align-items: center; }
.top .app-icon { width: 46px; height: 46px; flex: none; }
.top-txt { flex: 1; min-width: 0; }
.round-btn {

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function plural(n, s, p) { return n === 1 ? s : p; }
function todayKey() { return dayKey(new Date()); }
function utcOf(k) { const p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function diffDays(a, b) { return Math.round((utcOf(b) - utcOf(a)) / 86400000); }
function addDays(k, n) { const d = new Date(utcOf(k) + n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function fmtDay(k) { const p = k.split('-'); return (+p[2]) + ' ' + MES[+p[1] - 1]; }
function weekday(k) { return DIAS[new Date(utcOf(k)).getUTCDay()]; }
function fmtWhen(ms) {
  if (!(ms > 0)) return '';
  const d = new Date(ms), k = dayKey(d), t = todayKey();
  if (k === t) return 'hoy, ' + hm(d);
  if (k === addDays(t, -1)) return 'ayer, ' + hm(d);
  return fmtDay(k) + ', ' + hm(d);
}
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function okConn(c) { return !!(c && REPO_RE.test(String(c.repo || '')) && typeof c.token === 'string' && c.token.trim().length >= 20); }
function amountTxt(n) { return money(Math.abs(n)); }

function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3400);
}
function copyText(text, okMsg) {
  function manual() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    toast(ok ? okMsg : 'No se pudo copiar. Intenta de nuevo.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, manual);
  else manual();
}

// Los lectores usan Request de Scriptable; en el navegador, la misma consulta va con fetch.
async function getJSON(url, token) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : 0;
  try {
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(timer); }
}

/* ---------- Conexiones y copia local ---------- */
let cfg = (function () {
  const c = readJSON(CFG_KEY) || {}, out = { acc: {}, home: null };
  ACC_ORDER.forEach(function (k) { if (c.acc && okConn(c.acc[k])) out.acc[k] = { repo: String(c.acc[k].repo), token: c.acc[k].token.trim() }; });
  if (okConn(c.home)) out.home = { repo: String(c.home.repo), token: c.home.token.trim() };
  return out;
})();
function saveCfg() { writeJSON(CFG_KEY, cfg); }
// Las apps de la casa publican en el mismo buzón de FAN, salvo que se haya indicado otro
function homeConn() { return cfg.home || cfg.acc.fan || cfg.acc.master || cfg.acc.liderbci || null; }
function anyConn() { return !!homeConn() || !!cfg.acc.copec; }

let cache = readJSON(CACHE_KEY);
if (!cache || typeof cache !== 'object') cache = {};
cache.acc = cache.acc && typeof cache.acc === 'object' ? cache.acc : {};
cache.home = cache.home && typeof cache.home === 'object' ? cache.home : {};

const S = { acc: {}, home: cache.home, homeOld: false, at: +cache.at || 0, loading: false };
ACC_ORDER.forEach(function (k) { S.acc[k] = cfg.acc[k] ? (cache.acc[k] || { pending: true }) : { missing: true }; });

/* ---------- Lectura ---------- */
async function loadAcc(k) {
  const c = cfg.acc[k];
  if (!c) return { missing: true };
  try {
    const gh = ghFor(c);
    const r = await LOADERS[k].load(gh);
    if (k === 'liderbci' && !r.msg) {
      try {
        const st = await published(gh, APPS.liderbci.title, 'liderbci');   // la misma consulta, ya hecha
        if (st && typeof st.pts === 'number' && isFinite(st.pts)) r.pts = Math.round(st.pts);
      } catch (e) {}
    }
    return r;
  } catch (e) {
    const s = e && e.status;
    return { failed: true, msg: s === 401 ? 'El token venció. Pega de nuevo el script del widget de ' + ACC[k].name + '.'
      : s === 404 ? 'No se encontró el buzón de ' + ACC[k].name + '.' : 'No se pudo leer ' + ACC[k].name + '.' };
  }
}
async function loadHome() {
  const c = homeConn();
  if (!c) return { none: true };
  try {
    const list = await ghFor(c)('/milestones?state=all&per_page=100');
    const out = {};
    (Array.isArray(list) ? list : []).forEach(function (ms) {
      Object.keys(HOME).forEach(function (k) {
        if (!ms || ms.title !== HOME[k].title || !ms.description) return;
        try { const st = JSON.parse(ms.description); if (st && st.app === k) out[k] = st; } catch (e) {}
      });
    });
    return { data: out };
  } catch (e) { return { failed: true }; }
}
async function refresh(manual) {
  if (S.loading) return;
  if (!anyConn()) { if (manual) openSettings(); return; }
  S.loading = true; renderStamp();
  Object.keys(asked).forEach(function (k) { delete asked[k]; });
  const res = await Promise.all([Promise.all(ACC_ORDER.map(loadAcc)), loadHome()]);
  let failed = 0;
  ACC_ORDER.forEach(function (k, i) {
    let r = res[0][i];
    if (r.failed) {
      failed++;
      if (cache.acc[k] && !cache.acc[k].msg) r = Object.assign({}, cache.acc[k], { old: true, note: r.msg });
    } else if (r.missing) delete cache.acc[k];
    else if (!r.msg) cache.acc[k] = r;
    S.acc[k] = r;
  });
  const home = res[1];
  if (home.data) { S.home = home.data; S.homeOld = false; cache.home = home.data; }
  else if (home.failed) { failed++; S.homeOld = true; }
  else { S.home = {}; cache.home = {}; }
  S.loading = false;
  S.at = Date.now(); cache.at = S.at;
  writeJSON(CACHE_KEY, cache);
  render();
  if (failed && manual) toast('Sin conexión: se muestra lo último que se leyó.');
}

/* ---------- Cálculos de la casa ---------- */
function pagosInfo(p) {
  if (!p || !Array.isArray(p.s)) return null;
  let n = 0, done = 0;
  const pend = [];
  p.s.forEach(function (sec) {
    (Array.isArray(sec.i) ? sec.i : []).forEach(function (it) {
      n++;
      if (it.d) done++; else pend.push({ t: String(it.t || ''), s: String(sec.n || '') });
    });
  });
  // ¿La lista sigue con el título de un mes que ya pasó?
  const now = new Date(), title = String(p.title || '');
  const words = MESL.map(function (m) { return m; });
  const named = words.filter(function (m) { return new RegExp('\\b' + m + '\\b', 'i').test(title); })[0];
  const stale = !!named && named !== MESL[now.getMonth()] && !(named === 'septiembre' && /setiembre/i.test(title));
  return { title: title, n: n, done: done, pend: pend, secs: p.s, stale: stale, at: +p.at || 0 };
}
function gasInfo(g, today) {
  if (!g) return null;
  const base = { res: Math.max(0, Math.round(+g.res || 0)), kg: +g.kg > 0 ? +g.kg : null, at: +g.at || 0, avg: +g.avg > 0 ? +g.avg : null };
  if (!validDate(String(g.open || ''))) return Object.assign(base, { none: true });
  const d = Math.max(0, diffDays(g.open, today));
  const info = Object.assign(base, { open: g.open, d: d });
  if (info.avg) {
    const r = Math.max(Math.round(info.avg), 1);
    info.left = r - d; info.end = addDays(g.open, r); info.frac = Math.min(d / r, 1);
  }
  return info;
}
function capInfo(c, today) {
  if (!c) return null;
  if (typeof c.left !== 'number') return { none: true, at: +c.at || 0 };
  const left = Math.max(0, Math.round(c.left)), took = c.last === today;
  return {
    left: left, total: Math.max(left, Math.round(+c.total || 0)), took: took, at: +c.at || 0,
    ordered: validDate(String(c.ordered || '')) ? c.ordered : '',
    end: left > 0 ? addDays(today, took ? left : left - 1) : ''
  };
}
function turnOf(k) { const w = Math.round(diffDays(SHEETS.start, k) / 7); return SHEETS.order[((w % 2) + 2) % 2]; }
// Sábanas: el turno se calcula por fecha. Si la app Sábanas está conectada, además se sabe qué miércoles ya se marcaron.
function sheetsInfo(today) {
  const raw = S.home.sabanas, data = raw && Array.isArray(raw.hechos) ? raw : null, done = {};
  if (data) data.hechos.forEach(function (k) { if (validDate(String(k))) done[k] = 1; });
  const wed = addDays(today, (3 - new Date(utcOf(today)).getUTCDay() + 7) % 7);   // este miércoles (hoy si es miércoles)
  const pend = data && validDate(String(data.pend || '')) ? data.pend : '';
  const late = pend && pend < today ? pend : '';                                 // un miércoles pasado sin marcar
  const todayDone = wed === today && !!done[today];
  const next = late || (todayDone ? addDays(today, 7) : wed);
  const dates = [];
  if (late) dates.push(late);
  for (let i = 0; dates.length < 4; i++) { const d = addDays(wed, 7 * i); if (d !== late) dates.push(d); }
  const list = dates.map(function (d) {
    return { date: d, who: turnOf(d), done: !!done[d], late: !done[d] && d < today };
  });
  const tomorrow = addDays(today, 1);
  return { connected: !!data, at: data ? +data.at || 0 : 0, date: next, who: turnOf(next), late: !!late,
    today: !late && next === today, tomorrow: !late && next === tomorrow, todayDone: todayDone, list: list,
    // lo de hoy o mañana, aunque haya otro atrasado
    todayPending: wed === today && !done[today], tomorrowPending: wed === tomorrow && !done[tomorrow], wedWho: turnOf(wed) };
}
function mesInfo(m, today) {
  if (!m) return null;
  const ym = today.slice(0, 7), cur = m.mes && m.mes.ym === ym ? m.mes : {};
  return { piti: +cur.piti || 0, emi: +cur.emi || 0, tot: m.tot || {}, ult: Array.isArray(m.ult) ? m.ult : [], at: +m.at || 0 };
}

// Lo que hay que atender hoy, de lo más urgente a lo menos
function attention(today) {
  const out = [];
  const p = pagosInfo(S.home.pagos), g = gasInfo(S.home.gas, today), c = capInfo(S.home.capsula, today), sh = sheetsInfo(today);
  ACC_ORDER.forEach(function (k) {
    const r = S.acc[k];
    if (r && (k === 'fan' || k === 'copec') && typeof r.total === 'number' && r.total < 0) out.push({ tone: 'neg', w: 0, text: 'El saldo de ' + ACC[k].name + ' está en negativo' });
  });
  if (c && !c.none) {
    if (c.left <= 0) out.push({ tone: 'neg', w: 1, text: 'Se acabaron las cápsulas' });
    else if (c.left <= 12 && !c.ordered) out.push({ tone: c.left <= 5 ? 'neg' : 'warn', w: c.left <= 5 ? 1 : 3, text: (c.left === 1 ? 'Queda 1 cápsula' : 'Quedan ' + c.left + ' cápsulas') + ': manda a hacer la receta' });
    if (c.left > 0 && !c.took) out.push({ tone: 'info', w: 6, text: 'Falta la cápsula de hoy' });
  }
  if (g) {
    if (g.none) out.push({ tone: 'warn', w: 2, text: 'No hay balón de gas en uso' });
    else if (g.avg && g.left <= 3) {
      const t = g.left < 0 ? 'El gas lleva ' + (-g.left) + ' ' + plural(-g.left, 'día', 'días') + ' sobre su promedio'
        : g.left === 0 ? 'El gas llega hoy a su promedio' : 'Al gas le quedan unos ' + g.left + ' ' + plural(g.left, 'día', 'días');
      out.push({ tone: g.res ? 'warn' : 'neg', w: g.res ? 4 : 2, text: t + (g.res ? ' (hay reserva)' : ' y no hay reserva') });
    }
  }
  if (p && p.stale) out.push({ tone: 'warn', w: 3, text: 'Empieza el mes nuevo en Pagos del mes' });
  else if (p && p.pend.length) out.push({ tone: 'warn', w: 5, text: p.pend.length === 1 ? 'Falta 1 pago: ' + p.pend[0].t : 'Faltan ' + p.pend.length + ' pagos del mes' });
  if (sh.late) out.push({ tone: 'warn', w: 4, text: 'Sábanas atrasadas: le tocaba a ' + PEOPLE[sh.who] + ' el miércoles ' + fmtDay(sh.date) });
  if (sh.todayPending) out.push({ tone: 'info', w: 5, text: 'Hoy toca cambiar sábanas: ' + PEOPLE[sh.wedWho] });
  else if (sh.tomorrowPending) out.push({ tone: 'info', w: 7, text: 'Mañana toca cambiar sábanas: ' + PEOPLE[sh.wedWho] });
  return out.sort(function (a, b) { return a.w - b.w; });
}

/* ---------- Vistas ---------- */
function render() {
  const today = todayKey();
  todayEl.textContent = cap1(weekday(today)) + ' ' + (+today.slice(8)) + ' de ' + MESL[+today.slice(5, 7) - 1];
  renderHero(today);
  renderAccounts();
  renderHome(today);
  renderStamp();
}

function renderHero(today) {
  if (!anyConn()) {
    heroEl.innerHTML = I.house + '<div class="eyebrow">Bienvenido</div>' +
      '<div class="count-big ok">Conecta tus apps</div>' +
      '<p style="margin:10px 0 0;font-size:16px;color:var(--ds-hero-ink-2)">El panel junta en una pantalla lo que llevan FAN, Master, LiderBCI, Copec y las apps de la casa.</p>' +
      '<button type="button" class="hero-cta" data-act="settings">Conectar</button>';
    return;
  }
  const list = attention(today);
  let h = I.house + '<div class="eyebrow">Hoy</div>';
  if (!list.length) {
    h += '<div class="count-big ok">Todo al día</div><p style="margin:8px 0 0;font-size:16px;color:var(--ds-hero-ink-2)">Nada pendiente por ahora.</p>';
  } else {
    h += '<div class="count-big">' + list.length + '<span>' + plural(list.length, 'cosa por atender', 'cosas por atender') + '</span></div>';
    h += '<ul class="todo">' + list.slice(0, 5).map(function (a) { return '<li><i class="' + a.tone + '"></i><span>' + esc(a.text) + '</span></li>'; }).join('') + '</ul>';
  }
  heroEl.innerHTML = h;
}

function accCaption(k, r) {
  if (k === 'master' && r.month) return 'A pagar en ' + MESL[+r.month.slice(5, 7) - 1];
  if (k === 'liderbci') return r.n ? 'Periodo · ' + r.n + ' ' + plural(r.n, 'compra', 'compras') : 'Total del periodo';
  return ACC[k].cap;
}
function renderAccounts() {
  let old = false;
  accEl.innerHTML = ACC_ORDER.map(function (k) {
    const r = S.acc[k] || {}, name = ACC[k].name;
    let h = '<button type="button" class="tile" data-acc="' + k + '" aria-label="' + esc(name) + '">';
    h += '<span class="t-head"><img src="icons/apps/' + k + '.png" alt=""><b>' + esc(name) + '</b>' + (r.old ? '<i class="tag">sin conexión</i>' : '') + '</span>';
    if (r.old) old = true;
    if (r.missing) {
      h += '<span class="t-amt dim">—</span><span class="t-cap">Sin conectar</span><span class="t-gap"></span><span class="t-last"><span>Toca para conectar</span></span>';
    } else if (r.pending) {
      h += '<span class="t-amt dim">…</span><span class="t-cap">Leyendo</span>';
    } else if (r.msg) {
      h += '<span class="t-amt dim">—</span><span class="t-msg">' + esc(r.msg) + '</span>';
    } else {
      const has = typeof r.total === 'number';
      h += '<span class="t-amt' + (has && r.total < 0 ? ' neg' : '') + '">' + (has ? money(r.total) : esc(r.empty || 'Sin definir')) + '</span>';
      h += '<span class="t-cap">' + esc(accCaption(k, r)) + '</span>';
      if (k === 'liderbci' && typeof r.pts === 'number') h += '<span class="t-cap">' + dots(r.pts) + ' ' + plural(r.pts, 'punto', 'puntos') + '</span>';
      const b = (r.buys || [])[0];
      h += '<span class="t-gap"></span>';
      h += b ? '<span class="t-last"><b>' + esc(b.c) + '</b><span>' + amountTxt(b.m) + ' · ' + esc(dayLabel(b.d)) + '</span></span>' : '<span class="t-last"><span>Sin movimientos</span></span>';
    }
    return h + '</button>';
  }).join('');
  accNoteEl.textContent = old ? 'Lo último leído' : '';
}

function ringSvg(done, n) {
  const R = 18, C = 2 * Math.PI * R, f = n ? done / n : 0;
  return '<span class="ring' + (done < n ? ' part' : '') + '" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="5"/>' +
    '<circle class="fg" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - f)).toFixed(2) + '"/></svg>' +
    '<b>' + done + '/' + n + '</b></span>';
}
function homeRow(k, icon, title, sub, subTone, end, bar) {
  return '<li><button type="button" class="row" data-home="' + k + '">' +
    '<img class="r-icon" src="icons/apps/' + icon + '.png" alt="">' +
    '<span class="r-txt"><b>' + esc(title) + '</b><small class="' + (subTone || '') + '">' + sub + '</small>' + (bar || '') + '</span>' +
    (end ? '<span class="r-end">' + end + '</span>' : '') + I.chev + '</button></li>';
}
function offRow(k, icon, title) {
  return homeRow(k, icon, title, homeConn() ? 'Aún no publica · conéctala en la app' : 'Sin conectar', 'dim', '');
}
function renderHome(today) {
  let h = '';
  HOME_ORDER.forEach(function (k) {
    if (k === 'pagos') {
      const p = pagosInfo(S.home.pagos);
      if (!p) { h += offRow(k, 'pagos', HOME.pagos.name); return; }
      const sub = p.stale ? esc(p.title) + ' · empieza el mes nuevo' : esc(p.title) + ' · ' + (p.n === 0 ? 'lista vacía' : p.pend.length ? 'faltan ' + p.pend.length : 'todo pagado');
      h += homeRow(k, 'pagos', HOME.pagos.name, sub, p.stale ? 'warn' : '', p.n ? ringSvg(p.done, p.n) : '');
    } else if (k === 'gas') {
      const g = gasInfo(S.home.gas, today);
      if (!g) { h += offRow(k, 'gas', HOME.gas.name); return; }
      if (g.none) { h += homeRow(k, 'gas', HOME.gas.name, 'Sin balón en uso' + (g.res ? ' · reserva lista' : ''), 'warn', ''); return; }
      let sub, tone = '', bar = '';
      if (!g.avg) sub = 'Abierto el ' + fmtDay(g.open) + ' · sin promedio aún';
      else {
        if (g.left > 0) sub = 'Cambio cerca del ' + fmtDay(g.end);
        else if (g.left === 0) sub = 'Hoy llega a su promedio';
        else sub = (-g.left) + ' ' + plural(-g.left, 'día', 'días') + ' sobre el promedio';
        tone = g.left <= 0 ? 'warn' : '';
        const bt = g.left <= 0 ? (g.res ? 'warn' : 'neg') : g.left <= 3 ? 'warn' : '';
        bar = '<span class="r-bar ' + bt + '"><span style="width:' + Math.round(g.frac * 100) + '%"></span></span>';
      }
      sub += ' · ' + (g.res ? 'hay reserva' : 'sin reserva');
      h += homeRow(k, 'gas', HOME.gas.name, esc(sub), tone, '<span class="r-unit">Día</span><span class="r-big num">' + g.d + '</span>', bar);
    } else if (k === 'capsula') {
      const c = capInfo(S.home.capsula, today);
      if (!c) { h += offRow(k, 'capsula', HOME.capsula.name); return; }
      if (c.none) { h += homeRow(k, 'capsula', HOME.capsula.name, 'Sin frasco registrado', 'dim', ''); return; }
      const tone = c.left <= 5 ? 'neg' : c.left <= 12 && !c.ordered ? 'warn' : '';
      let sub = c.left <= 0 ? 'Frasco vacío' : 'Alcanza hasta el ' + fmtDay(c.end);
      sub += c.left > 0 ? (c.took ? ' · hoy tomada' : ' · hoy pendiente') : '';
      if (c.ordered) sub += ' · receta pedida';
      h += homeRow(k, 'capsula', HOME.capsula.name, esc(sub), tone && !c.ordered ? tone : '', '<span class="r-big num ' + tone + '">' + c.left + '</span><span class="r-unit">' + plural(c.left, 'queda', 'quedan') + '</span>');
    } else if (k === 'sabanas') {
      const s = sheetsInfo(today);
      let sub = s.late ? 'Atrasado: miércoles ' + fmtDay(s.date)
        : s.todayDone ? 'Hoy: hecho · próximo, miércoles ' + fmtDay(s.date)
        : s.today ? 'Hoy, miércoles ' + fmtDay(s.date) : s.tomorrow ? 'Mañana, miércoles ' + fmtDay(s.date) : 'Miércoles ' + fmtDay(s.date);
      if (!s.connected) sub += ' · sin conectar';
      h += homeRow(k, 'sabanas', 'Sábanas', esc(sub), s.late || s.today ? 'warn' : '', '<span class="who ' + s.who + '">' + PEOPLE[s.who] + '</span>');
    } else if (k === 'mesadas') {
      const m = mesInfo(S.home.mesadas, today);
      if (!m) { h += offRow(k, 'mesadas', HOME.mesadas.name); return; }
      const mes = MESL[+today.slice(5, 7) - 1];
      h += homeRow(k, 'mesadas', HOME.mesadas.name, cap1(mes) + ': Piti ' + money(m.piti) + ' · Emi ' + money(m.emi), '',
        '<span class="r-big num" style="font-size:19px">' + money(m.piti + m.emi) + '</span><span class="r-unit">este mes</span>');
    }
  });
  homeEl.innerHTML = h;
}

function renderStamp() {
  reloadEl.classList.toggle('spin', S.loading);
  reloadEl.setAttribute('aria-busy', S.loading ? 'true' : 'false');
  if (S.loading) { stampEl.textContent = 'Actualizando…'; return; }
  if (!anyConn()) { stampEl.textContent = 'Sin conexiones'; return; }
  stampEl.textContent = S.at ? 'Actualizado ' + fmtWhen(S.at) : 'Sin leer todavía';
}

/* ---------- Hojas ---------- */
let sheet = null, lastFocus = null;
function openSheet(kind, arg) {
  sheet = { kind: kind, arg: arg };
  lastFocus = document.activeElement;
  sheetEl.innerHTML = '<div class="backdrop" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" tabindex="-1">' + sheetBody(kind, arg) + '</div>';
  sheetEl.hidden = false;
  document.documentElement.classList.add('lock');
  const p = sheetEl.querySelector('.panel');
  p.setAttribute('aria-label', (p.querySelector('h2') || {}).textContent || 'Detalle');
  p.focus();
}
function closeSheet() {
  sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
  document.documentElement.classList.remove('lock');
  if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
}
function head(icon, title, sub) {
  return '<div class="p-head"><img src="icons/apps/' + icon + '.png" alt=""><div><h2>' + esc(title) + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div></div>';
}
function kv(a, b, cls) { return '<li class="kv ' + (cls || '') + '"><span>' + a + '</span><span>' + b + '</span></li>'; }
function updated(at) { return at ? '<p class="hint">La app publicó estos datos ' + esc(fmtWhen(at)) + '.</p>' : ''; }

function sheetBody(kind, arg) {
  const today = todayKey();
  if (kind === 'settings') return settingsBody();
  if (kind === 'acc') {
    const r = S.acc[arg] || {}, name = ACC[arg].name;
    if (r.missing) return head(arg, name, 'Sin conectar') + '<p class="note">Pega el script del widget de ' + esc(name) + ' en Conexiones para verla aquí.</p><button type="button" class="btn primary block" data-act="settings">Ir a Conexiones</button>';
    if (r.msg) return head(arg, name, '') + '<p class="note warn">' + esc(r.msg) + '</p><button type="button" class="btn tonal block" data-act="close">Cerrar</button>';
    const has = typeof r.total === 'number';
    let h = head(arg, name, esc(accCaption(arg, r)));
    h += '<div class="big' + (has && r.total < 0 ? ' neg' : '') + '">' + (has ? money(r.total) : esc(r.empty || 'Sin definir')) + '</div>';
    if (arg === 'liderbci' && typeof r.pts === 'number') h += '<p class="hint" style="margin-top:-8px">' + dots(r.pts) + ' ' + plural(r.pts, 'punto acumulado', 'puntos acumulados') + '</p>';
    if (r.old) h += '<p class="note warn">Sin conexión: es lo último que se leyó. ' + esc(r.note || '') + '</p>';
    h += '<h3 class="grp">Últimos movimientos</h3>';
    const buys = r.buys || [];
    h += buys.length ? '<ul class="list">' + buys.map(function (b) {
      const extra = arg === 'master' ? (b.w === 'A' ? ' · Adicional' : ' · Titular') : '';
      return kv(esc(b.c) + '<small>' + esc(dayLabel(b.d) + (b.h ? ' ' + b.h : '') + extra) + '</small>', amountTxt(b.m));
    }).join('') + '</ul>' : '<p class="hint">Aún no hay movimientos.</p>';
    h += '<p class="hint">' + (arg === 'liderbci' ? 'Es lo que LiderBCI publicó la última vez que cambió algo.' : 'Se calcula con lo que ' + esc(name) + ' publicó y los avisos que llegaron después al buzón, aunque no hayas abierto la app.') + '</p>';
    return h;
  }
  if (kind === 'home') {
    if (arg === 'sabanas') {
      const s = sheetsInfo(today);
      let h = head('sabanas', 'Sábanas', 'Se cambian los miércoles, una vez cada una');
      h += '<ul class="list">' + s.list.map(function (x) {
        const when = x.date === today ? 'Hoy' : x.date === addDays(today, 1) ? 'Mañana' : cap1(weekday(x.date)) + ' ' + fmtDay(x.date);
        const st = !s.connected ? (x.date === s.date ? 'Próximo cambio' : '')
          : x.done ? '<span class="ok">Hecho</span>' : x.late ? '<span class="late">Atrasado</span>' : x.date === s.date ? 'Próximo cambio' : 'Pendiente';
        return '<li class="kv"><span>' + esc(when) + (st ? '<small>' + st + '</small>' : '') + '</span><span><span class="who ' + x.who + '">' + PEOPLE[x.who] + '</span></span></li>';
      }).join('') + '</ul>';
      h += '<p class="hint">El turno se calcula a partir del miércoles 7 de octubre (Piti).' + (s.connected ? ' Los cambios hechos se marcan en la app Sábanas; publicó ' + esc(fmtWhen(s.at)) + '.' : '') + '</p>';
      return s.connected ? h : h + '<h3 class="grp">Saber si ya se hizo</h3>' + connectHelp('sabanas');
    }
    const raw = S.home[arg];
    if (!raw) return head(arg, HOME[arg].name, 'Sin datos todavía') + connectHelp(arg);
    if (arg === 'pagos') {
      const p = pagosInfo(raw);
      let h = head('pagos', p.title || HOME.pagos.name, p.n ? p.done + ' de ' + p.n + ' ' + plural(p.n, 'pago hecho', 'pagos hechos') : 'Lista vacía');
      if (p.stale) h += '<p class="note warn">La lista sigue con el título de ' + esc(p.title) + '. En Pagos del mes, usa «Nuevo mes» para empezar el mes actual.</p>';
      p.secs.forEach(function (sec) {
        const items = Array.isArray(sec.i) ? sec.i : [];
        if (!items.length) return;
        h += '<h3 class="grp">' + esc(sec.n || 'Pagos') + '</h3><ul class="list">' + items.map(function (it) {
          return '<li class="kv ' + (it.d ? 'done' : '') + '"><span class="lead"><i class="mini">' + (it.d ? I.check : '') + '</i>' + esc(it.t) + '</span><span>' +
            (it.d ? (validDate(String(it.a || '')) ? '<span class="ok">' + fmtDay(it.a) + '</span>' : '<span class="ok">Hecho</span>') : 'Pendiente') + '</span></li>';
        }).join('') + '</ul>';
      });
      return h + updated(p.at) + '<p class="hint">Los pagos se marcan en la app Pagos del mes.</p>';
    }
    if (arg === 'gas') {
      const g = gasInfo(raw, today);
      let h = head('gas', HOME.gas.name, g.none ? 'Sin balón en uso' : 'Día ' + g.d + ' del balón en uso');
      h += '<ul class="list">';
      if (!g.none) {
        h += kv('Abierto el', fmtDay(g.open));
        h += kv('Días de uso', String(g.d));
      }
      h += kv('Promedio por balón', g.avg ? String(Math.round(g.avg * 10) / 10).replace('.', ',') + ' días' : 'Aún sin promedio');
      if (!g.none && g.avg) h += kv('Cambio estimado', fmtDay(g.end) + (g.left >= 0 ? ' (faltan ' + g.left + ')' : ' (pasó hace ' + (-g.left) + ')'));
      h += kv('Reserva', g.res ? (g.res === 1 ? '1 balón lleno' : g.res + ' balones llenos') : '<span class="off">Sin reserva</span>');
      if (g.kg) h += kv('Tamaño', g.kg + ' kg');
      return h + '</ul>' + updated(g.at);
    }
    if (arg === 'capsula') {
      const c = capInfo(raw, today);
      if (c.none) return head('capsula', HOME.capsula.name, 'Sin frasco registrado') + '<p class="hint">Registra un frasco en Mi cápsula diaria para verlo aquí.</p>';
      let h = head('capsula', HOME.capsula.name, c.left <= 0 ? 'Frasco vacío' : (c.left === 1 ? 'Queda 1 cápsula' : 'Quedan ' + c.left + ' cápsulas'));
      h += '<ul class="list">';
      h += kv('Cápsula de hoy', c.took ? '<span class="ok">Tomada</span>' : 'Pendiente');
      if (c.end) h += kv('Alcanza hasta el', cap1(weekday(c.end)) + ' ' + fmtDay(c.end));
      h += kv('Frasco', c.left + ' de ' + c.total);
      h += kv('Receta', c.ordered ? '<span class="ok">Pedida el ' + fmtDay(c.ordered) + '</span>' : c.left <= 12 ? 'Hay que pedirla' : 'Aún no hace falta');
      return h + '</ul>' + updated(c.at) + '<p class="hint">Las alertas de la receta llegan al quedar 12, 10 y 5 cápsulas.</p>';
    }
    if (arg === 'mesadas') {
      const m = mesInfo(raw, today), mes = MESL[+today.slice(5, 7) - 1];
      let h = head('mesadas', HOME.mesadas.name, 'Aportes a Piti y Emi');
      h += '<h3 class="grp">' + cap1(mes) + '</h3><ul class="list">' + kv('<span class="who piti">Piti</span>', money(m.piti)) + kv('<span class="who emi">Emi</span>', money(m.emi)) + '</ul>';
      h += '<h3 class="grp">Total acumulado</h3><ul class="list">' + kv('Piti', money(+m.tot.piti || 0)) + kv('Emi', money(+m.tot.emi || 0)) + '</ul>';
      if (m.ult.length) {
        h += '<h3 class="grp">Últimos aportes</h3><ul class="list">' + m.ult.slice(0, 3).map(function (u) {
          return kv(esc(u.s || 'Aporte') + '<small>' + esc((PEOPLE[u.w] || '') + (validDate(String(u.d || '')) ? ' · ' + fmtDay(u.d) : '')) + '</small>', money(+u.m || 0));
        }).join('') + '</ul>';
      }
      return h + updated(m.at);
    }
  }
  return '';
}
function connectHelp(k) {
  if (!homeConn()) return '<p class="note">Primero conecta el buzón: pega el script del widget de FAN en Conexiones.</p><button type="button" class="btn primary block" data-act="settings">Ir a Conexiones</button>';
  return '<ol class="steps"><li>En Conexiones, toca «Copiar código para las apps».</li><li>Abre ' + esc(HOME[k].name) + ', baja hasta «Panel Casa» y toca «Pegar código».</li><li>Vuelve aquí y actualiza.</li></ol>' +
    '<button type="button" class="btn primary block" data-act="copycode">Copiar código para las apps</button>';
}

function settingsBody() {
  let h = '<div><h2>Conexiones</h2><p class="sub">El panel lee lo que cada app publica en tu buzón privado de GitHub. Los tokens quedan guardados solo en este iPhone.</p></div>';
  h += '<h3 class="grp">Cuentas</h3><ul class="list">' + ACC_ORDER.map(function (k) {
    const c = cfg.acc[k];
    return '<li class="kv icon"><img src="icons/apps/' + k + '.png" alt=""><span>' + ACC[k].name + '<small>' + (c ? esc(c.repo) : 'Falta el script del widget') + '</small></span><span>' + (c ? '<span class="ok">Conectada</span>' : '<span class="off">Sin conectar</span>') + '</span></li>';
  }).join('') + '</ul>';
  h += '<label class="field"><span>Pega el script del widget</span><textarea id="f-script" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="En FAN, Master, LiderBCI o Copec, toca «Copiar el script del widget» y pégalo aquí."></textarea></label>';
  h += '<p class="err" id="f-err" hidden></p>';
  h += '<button type="button" class="btn primary block" data-act="addscript">Conectar</button>';
  h += '<p class="hint">FAN, Master y LiderBCI comparten el buzón: con el script de FAN basta para las tres. Copec usa su propio buzón, así que necesita el suyo.</p>';
  h += '<h3 class="grp">Apps de la casa</h3><ul class="list">' + Object.keys(HOME).map(function (k) {
    const st = S.home[k];
    return '<li class="kv icon"><img src="icons/apps/' + k + '.png" alt=""><span>' + HOME[k].name + '<small>' + (st && st.at ? 'Publicó ' + esc(fmtWhen(+st.at)) : 'Aún no publica') + '</small></span><span>' + (st ? '<span class="ok">Conectada</span>' : '<span class="off">Sin conectar</span>') + '</span></li>';
  }).join('') + '</ul>';
  if (homeConn()) {
    h += '<button type="button" class="btn tonal block" data-act="copycode">Copiar código para las apps</button>';
    h += '<p class="hint">Luego, en Pagos del mes, Balón de gas, Mi cápsula diaria, Mesadas y Sábanas: baja hasta «Panel Casa», toca «Pegar código» y listo. Desde ahí, cada cambio se ve en el panel.</p>';
  } else {
    h += '<p class="hint">Cuando conectes FAN, aquí aparecerá el código para conectar las apps de la casa.</p>';
  }
  if (anyConn()) h += '<button type="button" class="btn danger block" data-act="forget" id="forget">Quitar conexiones</button>';
  return h;
}

/* ---------- Conectar ---------- */
function parseScript(text) {
  const s = String(text || '');
  const code = /CASA1\.([A-Za-z0-9+\/=]+)/.exec(s);
  if (code) {
    try { const o = JSON.parse(atob(code[1])); if (okConn({ repo: o.r, token: o.t })) return { home: true, repo: o.r, token: o.t.trim() }; } catch (e) {}
    return { err: 'El código no se pudo leer. Cópialo de nuevo.' };
  }
  const t = /^const MS_TITLE = '([^'\n]+)';/m.exec(s), r = /^const REPO = '([^'\n]*)';/m.exec(s), k = /^const TOKEN = '([^'\n]*)';/m.exec(s);
  if (!t || !r || !k) return { err: 'Eso no parece el script de un widget. En la app, toca «Copiar el script del widget» y pégalo completo.' };
  const key = ACC_ORDER.filter(function (x) { return APPS[x].title === t[1]; })[0];
  if (!key) return { err: 'Ese script es de otro widget. Sirven los de FAN, Master, LiderBCI y Copec.' };
  if (!okConn({ repo: r[1], token: k[1] }) || /^__/.test(k[1])) return { err: 'El script no trae el buzón o el token. Cópialo desde la app con el botón «Copiar el script del widget».' };
  return { key: key, repo: r[1], token: k[1].trim() };
}
function addScript() {
  const ta = $('f-script'), err = $('f-err');
  const p = parseScript(ta.value);
  if (p.err) { err.textContent = p.err; err.hidden = false; return; }
  const conn = { repo: p.repo, token: p.token };
  let msg;
  if (p.home) { cfg.home = conn; msg = 'Buzón de la casa conectado.'; }
  else {
    cfg.acc[p.key] = conn;
    const extra = [];
    if (p.key !== 'copec') ['fan', 'master', 'liderbci'].forEach(function (x) { if (x !== p.key && !cfg.acc[x]) { cfg.acc[x] = { repo: conn.repo, token: conn.token }; extra.push(ACC[x].name); } });
    msg = ACC[p.key].name + ' conectada' + (extra.length ? '; ' + extra.join(' y ') + ' usan el mismo buzón.' : '.');
  }
  saveCfg();
  ACC_ORDER.forEach(function (k) { if (cfg.acc[k] && S.acc[k] && S.acc[k].missing) S.acc[k] = { pending: true }; });
  closeSheet(); render(); toast(msg);
  refresh(false);
}
function copyCode() {
  const c = homeConn();
  if (!c) { openSettings(); return; }
  copyText('CASA1.' + btoa(JSON.stringify({ r: c.repo, t: c.token })), 'Código copiado. Pégalo en «Panel Casa» de cada app.');
}
let forgetArmed = false;
function forget(btn) {
  if (!forgetArmed) {
    forgetArmed = true; btn.classList.add('armed'); btn.textContent = 'Toca de nuevo para quitar';
    setTimeout(function () { forgetArmed = false; if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Quitar conexiones'; } }, 4000);
    return;
  }
  forgetArmed = false;
  cfg = { acc: {}, home: null }; saveCfg();
  cache = { acc: {}, home: {}, at: 0 }; writeJSON(CACHE_KEY, cache);
  ACC_ORDER.forEach(function (k) { S.acc[k] = { missing: true }; });
  S.home = {}; S.at = 0;
  closeSheet(); render(); toast('Se quitaron las conexiones de este iPhone.');
}
function openSettings() { openSheet('settings'); }

/* ---------- Eventos ---------- */
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act],[data-acc],[data-home]');
  if (!t) return;
  if (t.dataset.acc) { openSheet('acc', t.dataset.acc); return; }
  if (t.dataset.home) { openSheet('home', t.dataset.home); return; }
  const a = t.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 'reload') refresh(true);
  else if (a === 'settings') { if (sheet) closeSheet(); openSettings(); }
  else if (a === 'addscript') addScript();
  else if (a === 'copycode') copyCode();
  else if (a === 'forget') forget(t);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeSheet(); });
// Al volver a la app, se lee de nuevo si pasó más de un minuto
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { render(); if (Date.now() - S.at > 60000) refresh(false); }
});

render();
refresh(false);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
<script>
// Sin zoom con los dedos: Safari en iPhone no siempre respeta «user-scalable=no», así que se cortan sus gestos de zoom
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
